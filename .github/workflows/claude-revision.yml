# Claude revisa cada pull request y deja comentarios en las líneas donde encuentra errores.
# Usa la skill oficial /code-review y las reglas de CLAUDE.md.
#
# Necesita los mismos secretos que claude.yml. Si el repositorio no tiene ninguno,
# la revisión se salta con un aviso (no falla), así las copias de la plantilla no quedan en rojo.
name: Revisión de Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  revision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      CON_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Sin credenciales de Claude
        if: env.CON_CLAUDE != 'true'
        run: echo "::notice::No hay CLAUDE_CODE_OAUTH_TOKEN ni ANTHROPIC_API_KEY. Se salta la revisión (mira .github/workflows/claude.yml)."

      - name: Descargar el repositorio
        if: env.CON_CLAUDE == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Revisión con /code-review
        if: env.CON_CLAUDE == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
